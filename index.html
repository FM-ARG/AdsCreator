<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ads Creator App</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;700&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="app">
        <!-- App content will be injected here -->
        <header class="app-header">
            <div class="logo">
                <i class="fa-solid fa-shapes"></i>
                <span>AdsCreator</span>
            </div>
        </header>

        <main class="main-container">
            <section id="input-section" class="glass-panel">
                <div class="input-header">
                    <h2>Generador de Anuncios IA</h2>
                    <p>Transforma cualquier web en anuncios de alto impacto en segundos.</p>
                </div>

                <form id="adForm" class="ad-config-form">
                    <div class="form-group">
                        <label for="urlInput"><i class="fa-solid fa-link"></i> URL de la Landing Page</label>
                        <input type="url" id="urlInput" class="form-input" placeholder="https://tuempresa.com/producto"
                            required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="objectiveSelect"><i class="fa-solid fa-bullseye"></i> Objetivo</label>
                            <select id="objectiveSelect" class="form-select">
                                <option value="sales">Ventas / Conversión</option>
                                <option value="awareness">Reconocimiento de Marca</option>
                                <option value="traffic">Tráfico al Sitio</option>
                                <option value="leads">Captación de Leads</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="toneSelect"><i class="fa-solid fa-wand-magic-sparkles"></i> Tono de
                                Marca</label>
                            <select id="toneSelect" class="form-select">
                                <option value="profesional">Profesional y Serio</option>
                                <option value="friendly">Amigable y Cercano</option>
                                <option value="energetic">Energético y Vibrante</option>
                                <option value="minimal">Minimalista y Moderno</option>
                                <option value="luxury">Premium y Lujoso</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="ctaInput"><i class="fa-solid fa-mouse-pointer"></i> Call to Action (CTA)</label>
                        <input type="text" id="ctaInput" class="form-input"
                            placeholder="Ej: Compra ahora, Regístrate gratis, Descubre más...">
                    </div>

                    <button type="submit" class="btn-primary btn-generate">
                        <i class="fa-solid fa-bolt"></i> Generar Anuncios
                    </button>
                </form>
            </section>

            <section id="results-section" class="hidden">
                <!-- Generated Results -->
            </section>
        </main>
    </div>

    <!-- Application Script -->
    <script src="script.js"></script>
</body>

</html>
